<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Student</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h2>Update Student Details</h2>

<form th:action="@{/students/update}" method="post">
    <input type="hidden" name="id" th:value="${student.id}">

    <label>Name:</label>
    <input type="text" name="name" required th:value="${student.name}"><br>

    <label>Phone:</label>
    <input type="text" name="phone" required th:value="${student.phone}"><br>

    <label>Address:</label>
    <input type="text" name="address" required th:value="${student.address}"><br>

    <label>Email:</label>
    <input type="email" name="email" required th:value="${student.email}"><br>

    <button type="submit">Update</button>
</form>
<br>
<form th:action="@{/students}" method="get">
    <button type="submit">Back to Students List</button>
</form>
</body>
</html>
